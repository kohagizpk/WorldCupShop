<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            Carrinho - WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Carrinho
                <span class="text-primary">
                    <svg class="icone-carrinho" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.5 13h12l2.5-9H6"/>
                    </svg>
                </span>
            </h1>
            <div th:if="${#lists.isEmpty(itens)}" class="painel-branco p-4 text-center">
                <h4>
                    Seu carrinho está vazio!
                </h4>
                <p>
                    Aproveite as ofertas e adicione produtos ao carrinho.
                </p>
                <a class="btn btn-primary" th:href="@{/produtos}">
                    Início
                </a>
            </div>
            <div class="row g-4" th:unless="${#lists.isEmpty(itens)}">
                <div class="col-md-9">
                    <div th:each="i:${itens}" class="carrinho-linha">
                        <div class="row align-items-center g-2">
                            <div class="col-md-6">
                                <strong th:text="${i.produto.nome}">
                                </strong>
                                <div class="text-muted small" th:text="${i.produto.selecao.nome}">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <form th:action="@{/carrinho/alterar/{id}(id=${i.id})}" method="post" class="d-flex gap-2">
                                    <input type="number" name="quantidade" min="0" th:value="${i.quantidade}" class="form-control">
                                    <button class="btn btn-outline-primary btn-sm">
                                        Atualizar
                                    </button>
                                </form>
                                <small>
                                    Use 0 para remover
                                </small>
                            </div>
                            <div class="col-md-3 text-end fw-bold" th:text="${'R$ '+i.produto.preco}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="caixa-total">
                        <h4>
                            Total
                        </h4>
                        <p class="fw-bold" th:text="${'R$ '+total}">
                        </p>
                        <form method="post" th:action="@{/pedidos/finalizar}">
                            <button class="btn btn-primary w-100">
                                Comprar
                            </button>
                        </form>
                        <small class="text-muted">
                            Compra simulada, sem pagamento real.
                        </small>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
