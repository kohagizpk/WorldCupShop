<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1 th:text="${selecao.id == null ? 'Criar seleção' : 'Editar seleção'}">
                Seleção
            </h1>
            <p>
                Cadastre a seleção e o país para organizar os produtos da loja.
            </p>
            <form class="formulario" method="post" th:action="@{/admin/selecoes/salvar}" th:object="${selecao}">
                <input type="hidden" th:field="*{id}">
                <label>
                    Nome
                    <input class="form-control mb-3" th:field="*{nome}" required>
                </label>
                <label>
                    País
                    <input class="form-control mb-3" th:field="*{pais}" required>
                </label>
                <button class="btn btn-primary" type="submit">
                    Salvar seleção
                </button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/selecoes}">
                    Cancelar
                </a>
            </form>
        </main>
    </body>
</html>
