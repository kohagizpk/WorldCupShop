<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Gerenciar seleções
            </h1>
            <p>
                <a class="btn btn-primary" th:href="@{/admin/selecoes/criar}">
                    Nova seleção
                </a>
            </p>
            <p class="text-muted" th:if="${#lists.isEmpty(selecoes)}">
                Nenhuma seleção cadastrada ainda.
            </p>
            <table class="table" th:unless="${#lists.isEmpty(selecoes)}">
                <tr>
                    <th>
                        Nome
                    </th>
                    <th>
                        País
                    </th>
                    <th>
                        Ações
                    </th>
                </tr>
                <tr th:each="s:${selecoes}">
                    <td th:text="${s.nome}">
                    </td>
                    <td th:text="${s.pais}">
                    </td>
                    <td>
                        <a th:href="@{/admin/selecoes/editar/{id}(id=${s.id})}">
                            Editar
                        </a>
                    </td>
                </tr>
            </table>
        </main>
    </body>
</html>
