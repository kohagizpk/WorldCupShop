<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Administração
            </h1>
            <p>
                <a th:href="@{/admin/produtos}">
                    Gerenciar produtos
                </a>
                |
                <a th:href="@{/admin/categorias}">
                    Gerenciar categorias
                </a>
                |
                <a th:href="@{/admin/categorias/criar}">
                    Criar categoria
                </a>
                |
                <a th:href="@{/admin/selecoes}">
                    Gerenciar seleções
                </a>
                |
                <a th:href="@{/admin/selecoes/criar}">
                    Criar seleção
                </a>
            </p>
            <h3>
                Todos os pedidos
            </h3>
            <table class="table">
                <tr>
                    <th>
                        Nº
                    </th>
                    <th>
                        Cliente
                    </th>
                    <th>
                        Status
                    </th>
                    <th>
                        Valor
                    </th>
                </tr>
                <tr th:each="p:${pedidos}">
                    <td th:text="${p.id}">
                    </td>
                    <td th:text="${p.usuario.nome}">
                    </td>
                    <td th:text="${p.status}">
                    </td>
                    <td th:text="${p.valorTotal}">
                    </td>
                </tr>
            </table>
        </main>
    </body>
</html>
