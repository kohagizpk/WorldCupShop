<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Gerenciar produtos
            </h1>
            <p>
                <a class="btn btn-primary" th:href="@{/admin/produtos/criar}">
                    Cadastrar produto
                </a>
                <a class="btn btn-outline-primary" th:href="@{/admin/categorias/criar}">
                    Criar categoria
                </a>
                <a class="btn btn-outline-secondary" th:href="@{/admin/categorias}">
                    Gerenciar categorias
                </a>
            </p>
            <table class="table">
                <tr>
                    <th>
                        Nome
                    </th>
                    <th>
                        Categoria
                    </th>
                    <th>
                        Seleção
                    </th>
                    <th>
                        Estoque
                    </th>
                    <th>
                        Ações
                    </th>
                </tr>
                <tr th:each="p:${produtos}">
                    <td th:text="${p.nome}">
                    </td>
                    <td th:text="${p.categoria.nome}">
                    </td>
                    <td th:text="${p.selecao.nome}">
                    </td>
                    <td th:text="${p.estoque}">
                    </td>
                    <td>
                        <a th:href="@{/admin/produtos/editar/{id}(id=${p.id})}">
                            Editar
                        </a>
                        <form method="post" th:action="@{/admin/produtos/excluir/{id}(id=${p.id})}" class="d-inline">
                            <button class="btn btn-sm btn-outline-danger">
                                Excluir
                            </button>
                        </form>
                    </td>
                </tr>
            </table>
        </main>
    </body>
</html>
