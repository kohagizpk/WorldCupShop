<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Gerenciar categorias
            </h1>
            <p>
                <a class="btn btn-primary" th:href="@{/admin/categorias/criar}">
                    Nova categoria
                </a>
            </p>
            <table class="table">
                <tr>
                    <th>
                        Nome
                    </th>
                    <th>
                        Descrição
                    </th>
                    <th>
                        Ações
                    </th>
                </tr>
                <tr th:each="c:${categorias}">
                    <td th:text="${c.nome}">
                    </td>
                    <td th:text="${c.descricao}">
                    </td>
                    <td>
                        <a th:href="@{/admin/categorias/editar/{id}(id=${c.id})}">
                            Editar
                        </a>
                        <form class="d-inline" method="post" th:action="@{/admin/categorias/excluir/{id}(id=${c.id})}">
                            <button class="btn btn-sm btn-outline-danger">
                                Excluir
                            </button>
                        </form>
                    </td>
                </tr>
            </table>
        </main>
    </body>
</html>
