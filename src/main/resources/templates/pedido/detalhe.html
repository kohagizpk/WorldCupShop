<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1 th:text="${'Pedido #'+pedido.id}">
            </h1>
            <p th:text="${pedido.status}">
            </p>
            <table class="table">
                <tr>
                    <th>
                        Produto
                    </th>
                    <th>
                        Quantidade
                    </th>
                    <th>
                        Preço unitário
                    </th>
                </tr>
                <tr th:each="i:${itens}">
                    <td th:text="${i.produto.nome}">
                    </td>
                    <td th:text="${i.quantidade}">
                    </td>
                    <td th:text="${'R$ '+i.precoUnitario}">
                    </td>
                </tr>
            </table>
            <h4 th:text="${'Total: R$ '+pedido.valorTotal}">
            </h4>
        </main>
    </body>
</html>
