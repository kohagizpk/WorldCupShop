<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Meus pedidos
            </h1>
            <p th:if="${param.sucesso}" class="alert alert-success">
                Pedido realizado!
            </p>
            <table class="table">
                <thead>
                    <tr>
                        <th>
                            Nº
                        </th>
                        <th>
                            Data
                        </th>
                        <th>
                            Status
                        </th>
                        <th>
                            Total
                        </th>
                        <th>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p:${pedidos}">
                        <td th:text="${p.id}">
                        </td>
                        <td th:text="${p.data}">
                        </td>
                        <td th:text="${p.status}">
                        </td>
                        <td th:text="${'R$ '+p.valorTotal}">
                        </td>
                        <td>
                            <a th:href="@{/pedidos/{id}(id=${p.id})}">
                                Ver
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
