<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            Cadastro - WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <section class="formulario">
                <h1>
                    Cadastro do usuário
                </h1>
                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}">
                </div>
                <form method="get" th:action="@{/cadastro}" class="row g-2 mb-4">
                    <div class="col-sm-8">
                        <label for="consultaCep">
                            CEP
                        </label>
                        <input id="consultaCep" name="cep" class="form-control" placeholder="00000-000" maxlength="9" th:value="${cep}" required>
                    </div>
                    <div class="col-sm-4 align-self-end">
                        <button class="btn btn-outline-primary w-100">
                            Buscar CEP
                        </button>
                    </div>
                    <small class="text-muted">
                        Busca o endereço no ViaCEP sem utilizar JavaScript. Consulte o CEP antes de preencher o cadastro.
                    </small>
                </form>
                <form method="post" th:action="@{/cadastro}" class="row g-3">
                    <div class="col-md-6">
                        <label>
                            Usuário
                            <input name="nome" class="form-control" required>
                        </label>
                    </div>
                    <div class="col-md-6">
                        <label>
                            Senha
                            <input type="password" name="senha" minlength="6" class="form-control" required>
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label>
                            CEP
                            <input name="cep" class="form-control" th:value="${cep}" maxlength="9">
                        </label>
                    </div>
                    <div class="col-md-8">
                        <label>
                            Endereço
                            <input name="endereco" class="form-control" th:value="${endereco}">
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label>
                            Bairro
                            <input name="bairro" class="form-control" th:value="${bairro}">
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label>
                            Cidade
                            <input name="cidade" class="form-control" th:value="${cidade}">
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label>
                            UF
                            <input name="uf" class="form-control" th:value="${uf}" maxlength="2">
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label>
                            Número
                            <input name="numero" class="form-control">
                        </label>
                    </div>
                    <div class="col-md-8">
                        <label>
                            Complemento
                            <input name="complemento" class="form-control">
                        </label>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary w-100">
                            Cadastrar
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
