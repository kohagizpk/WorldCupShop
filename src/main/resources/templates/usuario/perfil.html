<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Meu perfil
            </h1>
            <p th:if="${erro}" th:text="${erro}" class="alert alert-danger">
            </p>
            <form th:action="@{/perfil}" method="post" class="formulario">
                <label>
                    Usuário
                    <input name="nome" th:value="${usuario.nome}" class="form-control mb-3" required>
                </label>
                <label>
                    Nova senha (deixe vazio para manter)
                    <input type="password" name="senha" class="form-control mb-3">
                </label>
                <button class="btn btn-primary">
                    Salvar alterações
                </button>
            </form>
        </main>
    </body>
</html>
