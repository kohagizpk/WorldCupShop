<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5">
            <h1>
                Entrar
            </h1>
            <p th:if="${param.error}" class="alert alert-danger">
                Usuário ou senha incorretos.
            </p>
            <p th:if="${param.cadastro}" class="alert alert-success">
                Cadastro realizado. Entre com sua conta.
            </p>
            <form method="post" th:action="@{/login}" class="formulario">
                <label>
                    Usuário
                    <input class="form-control mb-3" name="username" required>
                </label>
                <label>
                    Senha
                    <input type="password" class="form-control mb-3" name="password" required>
                </label>
                <button class="btn btn-primary">
                    Entrar
                </button>
            </form>
            <p class="mt-3">
                <a th:href="@{/cadastro}">
                    Criar conta
                </a>
            </p>
        </main>
    </body>
</html>
