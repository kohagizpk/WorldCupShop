<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            Produto - WorldCupShop
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="~{fragmentos :: menu}">
        </div>
        <main class="container pb-5 detalhe-fundo">
            <div class="row g-5">
                <div class="col-md-6">
                    <img th:if="${produto.imagem != null and !produto.imagem.isBlank()}" th:src="${produto.imagem}" class="imagem-detalhe" alt="Produto">
                    <div th:unless="${produto.imagem != null and !produto.imagem.isBlank()}" class="placeholder-imagem imagem-detalhe">
                        ▧
                    </div>
                </div>
                <div class="col-md-6">
                    <h1 th:text="${produto.nome}">
                    </h1>
                    <p class="text-muted" th:text="${produto.categoria.nome+' | '+produto.selecao.nome}">
                    </p>
                    <p class="preco-grande" th:text="${'R$ '+produto.preco}">
                    </p>
                    <p th:text="${produto.descricao}">
                    </p>
                    <p>
                        Estoque:
                        <span th:text="${produto.estoque}">
                        </span>
                    </p>
                    <form th:action="@{/carrinho/adicionar}" method="post">
                        <input type="hidden" name="produtoId" th:value="${produto.id}">
                        <label>
                            Quantidade
                            <input type="number" min="1" name="quantidade" value="1" class="form-control mb-3" style="max-width:120px">
                        </label>
                        <button class="btn btn-primary px-4" th:disabled="${produto.estoque == 0}">
                            Adicionar ao carrinho
                        </button>
                    </form>
                    <a class="btn btn-outline-primary mt-3" th:href="@{/carrinho}">
                        Ver carrinho
                    </a>
                </div>
            </div>
        </main>
    </body>
</html>
