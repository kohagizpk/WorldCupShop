spring.application.name=WorldCupShop
spring.datasource.url=jdbc:postgresql://localhost:5432/worldcupshop
spring.datasource.username=postgres
spring.datasource.password=postdba
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

# IDs gerados por sequencias para compatibilidade com PostgreSQL 9.5.

# Tamanho maximo de imagem enviada pelo formulario.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
